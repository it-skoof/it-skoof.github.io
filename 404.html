<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      const segment = 1;
      const path = window.location.pathname
        .split('/')
        .slice(segment + 1)
        .join('/');

      const redirect = '/' +
        window.location.pathname.split('/')[segment] +
        '/?/' + path +
        window.location.search.replace('?', '&') +
        window.location.hash;

      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
