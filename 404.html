<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      const segmentCount = 1;
      const location = window.location;
      const repo = location.pathname.split('/')[1];

      sessionStorage.redirect =
        location.pathname + location.search + location.hash;

      location.replace(
        location.origin + '/' + repo + '/'
      );
    </script>
  </head>
  <body></body>
</html>
